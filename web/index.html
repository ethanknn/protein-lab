<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protein Lab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='8.5' r='5' fill='%232a78d6'/><circle cx='7.5' cy='23' r='4.2' fill='%23eb6834'/><circle cx='24.5' cy='23' r='4.2' fill='%231baf7a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/3dmol@2.4.2/build/3Dmol-min.js"></script>
<style>
/* Layout: a fixed instrument rail on the left, a scrolling work surface on
   the right; single column under 900px. Colour tokens first, everything
   derived from them so both themes swap in one place. */
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7; --raised:#ffffff;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-550:#1c5cab;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --radius:10px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#1a1a19; --plane:#0d0d0d; --raised:#222221;
    --ink-1:#f0efec; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --seq-100:#104281; --seq-250:#184f95; --seq-400:#2a78d6; --seq-550:#86b6ef;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --raised:#222221;
  --ink-1:#f0efec; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --seq-100:#104281; --seq-250:#184f95; --seq-400:#2a78d6; --seq-550:#86b6ef;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink-1);
  font:15px/1.55 var(--sans); -webkit-font-smoothing:antialiased;
}
a{color:var(--s1)}
h1,h2,h3{letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:clamp(22px,2.6vw,30px);font-weight:600}
h2{font-size:19px;font-weight:600}
h3{font-size:14px;font-weight:600;color:var(--ink-2)}
.mono{font-family:var(--mono)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.rail{
  background:var(--surface-1);border-right:1px solid var(--border);
  padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px, env(safe-area-inset-left,0px));
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--s1);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 22%,transparent)}
.brand b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.rail .tag{font-size:12px;color:var(--ink-3);margin-bottom:20px}
.railsec{font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin:20px 0 8px;font-weight:600}
.main{
  min-width:0;
  padding:26px calc(24px + env(safe-area-inset-right,0px)) 80px 24px;
}
.wrap{max-width:1080px;margin:0 auto}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;
    border-bottom:1px solid var(--border)}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));
        padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- controls ---------- */
button,select,input{font:inherit;color:var(--ink-1);background:var(--surface-1);
  border:1px solid var(--axis);border-radius:8px;padding:7px 11px}
button{cursor:pointer}
button:hover:not(:disabled){background:var(--plane)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--s1);border-color:var(--s1);color:#fff;
  font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--s1)}
button.ghost{border-color:transparent;background:transparent;color:var(--ink-2);
  padding:6px 8px}
button.ghost:hover{background:var(--plane);color:var(--ink-1)}
input[type=search]{width:100%}
input[type=range]{padding:0;border:none;background:transparent;width:100%}
label{font-size:13px;color:var(--ink-2)}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}

/* ---------- cards ---------- */
.card{background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}

.tcard{text-align:left;width:100%;background:var(--surface-1);
  border:1px solid var(--border);border-radius:var(--radius);padding:16px;
  display:flex;flex-direction:column;gap:8px;transition:border-color .12s}
.tcard:hover{border-color:var(--s1);background:var(--surface-1)}
.tcard .gene{font-family:var(--mono);font-weight:600;font-size:15px;
  color:var(--ink-1)}
.tcard .dis{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}

.pill{font-size:11px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--border);color:var(--ink-2);background:var(--plane);
  white-space:nowrap}
.pill.epi{font-family:var(--mono);color:var(--ink-1)}
.pill.warn{border-color:color-mix(in srgb,var(--serious) 45%,transparent);
  color:var(--serious)}
.pill.ok{border-color:color-mix(in srgb,var(--good) 45%,transparent);
  color:var(--good)}
.pill.s1{border-color:color-mix(in srgb,var(--s1) 45%,transparent);color:var(--s1)}

/* ---------- banner ---------- */
.banner{border:1px solid var(--border);border-left:3px solid var(--warning);
  background:var(--surface-1);border-radius:var(--radius);padding:16px 18px;
  margin-bottom:22px}
.banner h2{font-size:15px;margin-bottom:8px}
.banner p{margin:0 0 9px;color:var(--ink-2);font-size:13.5px;max-width:86ch}
.banner p:last-child{margin-bottom:0}
.banner strong{color:var(--ink-1)}

/* ---------- tiles ---------- */
.tile{background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius);padding:15px 16px}
.tile .lab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
.tile .val{font-size:27px;font-weight:650;line-height:1.1;letter-spacing:-.02em}
.tile .foot{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.4}

/* ---------- viewer ---------- */
.viewer{width:100%;height:360px;position:relative;border-radius:8px;
  overflow:hidden;background:var(--plane);border:1px solid var(--border)}
.viewer.sm{height:290px}
.vlegend{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px;font-size:12px;
  color:var(--ink-2)}
.vlegend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;
  border:1px solid var(--border)}
.ctrls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:11px}

/* ---------- data ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;white-space:nowrap}
td{font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--plane)}
tbody tr.sel{background:var(--plane);box-shadow:inset 2px 0 0 var(--s1)}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,180px) 1fr 52px;gap:11px;
  align-items:center;font-size:12.5px;cursor:help}
.bar .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.track{height:12px;background:var(--grid);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px}
.bar .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar.unranked .nm,.bar.unranked .pc{color:var(--ink-3)}
.bar.unranked .track{opacity:.55}
.subhead{font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);margin:18px 0 5px;padding-top:14px;
  border-top:1px solid var(--grid);font-weight:600}
.subnote{font-size:12px;color:var(--ink-3);margin:0 0 12px;max-width:82ch;
  line-height:1.5}

.seq{font-family:var(--mono);font-size:12px;word-break:break-all;
  line-height:1.75;color:var(--ink-2)}
.seq .v{background:var(--seq-250);color:#07243f;border-radius:3px;
  padding:1px 2px;font-weight:600}
:root[data-theme="dark"] .seq .v{color:#eaf3ff}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .seq .v{color:#eaf3ff}
}

.flags{margin:12px 0 0;padding:0;list-style:none;font-size:12.5px}
.flags li{padding:5px 0 5px 20px;position:relative;color:var(--ink-2)}
.flags li::before{content:"!";position:absolute;left:5px;color:var(--serious);
  font-weight:700}

details{border-top:1px solid var(--grid);padding:11px 0 2px}
summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:600;
  list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";color:var(--ink-3)}
details[open] summary::before{content:"\2212 "}
details .body{padding:9px 0 3px;font-size:13px;color:var(--ink-2);max-width:84ch}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;
  font-size:12.5px}
dt{color:var(--ink-3)}
dd{margin:0;color:var(--ink-2)}
code{font-family:var(--mono);font-size:12px;background:var(--plane);
  padding:1px 5px;border-radius:4px}
pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;margin:0;
  color:var(--ink-2)}

/* ---------- progress ---------- */
.prog{height:7px;background:var(--grid);border-radius:999px;overflow:hidden}
.prog>div{height:100%;background:var(--s1);border-radius:999px;
  transition:width .35s ease}
.stage{font-size:13px;color:var(--ink-2);margin-top:9px;
  font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:11px;height:11px;border-radius:50%;
  border:2px solid var(--grid);border-top-color:var(--s1);
  animation:sp .8s linear infinite;vertical-align:-1px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .spin{animation:none}
  .prog>div{transition:none}
}

.tip{position:fixed;pointer-events:none;background:var(--raised);
  border:1px solid var(--axis);border-radius:8px;padding:9px 11px;font-size:12px;
  color:var(--ink-1);box-shadow:0 8px 26px rgba(0,0,0,.16);max-width:320px;
  opacity:0;transition:opacity .1s;z-index:50;line-height:1.45}
svg{display:block;width:100%;height:auto;overflow:visible}
.axl{fill:var(--ink-3);font-size:11px;font-family:var(--sans)}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--axis);stroke-width:1}
.hidden{display:none!important}
.secnote{color:var(--ink-3);font-size:13px;margin:4px 0 16px;max-width:82ch}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;
  color:var(--ink-3)}
section{margin:26px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><span class="dot"></span><b>Protein Lab</b></div>
    <div class="tag" id="railTag">loading…</div>

    <div class="railsec">Search</div>
    <input type="search" id="q" placeholder="disease, gene, protein…"
           autocomplete="off" aria-label="Search targets">

    <div class="railsec">Disease areas</div>
    <div id="areaList"></div>

    <div class="railsec">Your own</div>
    <a href="#build" id="buildLink"
       style="display:block;font-size:13px;padding:5px 0;color:var(--s1)">
      Design against any protein</a>
    <a href="#specimen" id="specimenLink"
       style="display:block;font-size:13px;padding:5px 0;color:var(--s1)">
      Rank targets for a specimen</a>

    <div class="railsec">Session</div>
    <div id="runList" style="font-size:12.5px;color:var(--ink-3)">
      No runs yet.
    </div>

    <div class="railsec">Display</div>
    <button class="ghost" id="themeBtn">Toggle theme</button>
  </aside>

  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div class="tip" id="tip"></div>
<script src="/static/app.js"></script>
</body>
</html>
